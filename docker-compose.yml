services:
  # ── Banco de dados PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: visit-control-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: visit_control
      POSTGRES_USER: visit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-visit_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visit_user -d visit_control"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (API Express) ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: visit-control-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://visit_user:${DB_PASSWORD:-visit_pass}@db:5432/visit_control
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Nginx (frontend estático + proxy reverso para backend) ─────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: visit-control-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local
