<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Visitantes</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font:16px system-ui,sans-serif}main{width:min(92vw,520px);padding:36px;background:#fff;border-radius:18px;box-shadow:0 18px 45px #0f172a1c;text-align:center}img{width:112px;height:112px;object-fit:contain;margin-bottom:14px}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 24px;color:#475569;line-height:1.5}label{display:block;text-align:left;font-weight:600;margin-bottom:7px}input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.actions{display:flex;gap:10px;margin-top:14px}button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#84a90a;color:#fff}.secondary{background:#e2e8f0;color:#334155}#message{min-height:22px;margin:12px 0 0;color:#b91c1c;font-size:14px}
</style></head><body><main><img src="../assets/icon.png" alt="Brasão da Prefeitura"><h1>Controle de Visitantes</h1><p>Não foi possível conectar ao sistema. Confira a rede e o endereço do servidor.</p><label for="serverUrl">Endereço do sistema</label><input id="serverUrl" type="url" placeholder="https://visitas.exemplo.gov.br"><div class="actions"><button class="secondary" id="retry">Tentar novamente</button><button class="primary" id="save">Salvar e conectar</button></div><div id="message"></div></main>
<script>const p=new URLSearchParams(location.search),i=document.getElementById('serverUrl'),m=document.getElementById('message');i.value=p.get('serverUrl')||'';document.getElementById('retry').onclick=()=>window.desktopApp.retryConnection();document.getElementById('save').onclick=async()=>{m.textContent='Conectando…';const r=await window.desktopApp.saveServerUrl(i.value);if(!r.ok)m.textContent=r.message};i.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save').click()});</script></body></html>
